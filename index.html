<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFNYC Tracks</title>
<meta name="description" content="CrossFit NYC weekly programming by track — see every workout, pick one per day, and get your week.">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --card2:#f8fafc; --text:#1a202c; --muted:#5f6b7a; --light:#a0aec0; --border:#e2e8f0;
  --accent:#0891b2; --ann-bg:#fffbeb; --ann-border:#f6e05e; --ann-title:#92400e;
  --t-crossfit:#0891b2; --t-athx:#c2410c; --t-strength:#6d28d9; --t-oly:#15803d; --t-rest:#94a3b8;
  --q-power:#2a78d6; --q-strength:#eb6834; --q-hypertrophy:#1baf7a; --q-skill:#eda100;
  --q-aerobic:#e87ba4; --q-threshold:#008300; --q-vo2:#4a3aa7; --q-hiit:#e34948; --q-sprint:#2a78d6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1a1d21; --card2:#22262c; --text:#e6e9ee; --muted:#a3adba; --light:#6b7482; --border:#2c323a;
    --accent:#0e9fb8; --ann-bg:#2a2410; --ann-border:#8a6d1a; --ann-title:#f2c14e;
    --t-crossfit:#0e9fb8; --t-athx:#e06f22; --t-strength:#8b5cf6; --t-oly:#2fae5a; --t-rest:#5b6472;
    --q-power:#3987e5; --q-strength:#d95926; --q-hypertrophy:#199e70; --q-skill:#c98500;
    --q-aerobic:#d55181; --q-threshold:#008300; --q-vo2:#9085e9; --q-hiit:#e66767; --q-sprint:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d21; --card2:#22262c; --text:#e6e9ee; --muted:#a3adba; --light:#6b7482; --border:#2c323a;
  --accent:#0e9fb8; --ann-bg:#2a2410; --ann-border:#8a6d1a; --ann-title:#f2c14e;
  --t-crossfit:#0e9fb8; --t-athx:#e06f22; --t-strength:#8b5cf6; --t-oly:#2fae5a; --t-rest:#5b6472;
  --q-power:#3987e5; --q-strength:#d95926; --q-hypertrophy:#199e70; --q-skill:#c98500;
  --q-aerobic:#d55181; --q-threshold:#008300; --q-vo2:#9085e9; --q-hiit:#e66767; --q-sprint:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1400px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--light)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card2);color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
section{margin-top:22px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
h2 span{text-transform:none;letter-spacing:0;font-weight:500;margin-left:8px}

/* announcements banner */
.ann{background:var(--ann-bg);border:1px solid var(--ann-border);border-radius:12px;padding:12px 16px 6px;margin-top:6px}
.ann h2{color:var(--ann-title);margin-bottom:8px}
.ann-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px}
.ann-item{padding:4px 0 8px;font-size:12.5px;line-height:1.35}
.ann-item b{display:block;font-size:13px;color:var(--text)}
.ann-item span{color:var(--muted)}

/* your week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--tc,var(--t-rest));border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block}
.tile:hover{border-color:var(--tc,var(--light))}
.tile .d{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tile .d b{color:var(--text)}
.tile .tr{font-size:11px;font-weight:700;color:var(--tc,var(--muted));margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.tile .t{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* day rows */
.day{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-top:12px;scroll-margin-top:12px}
.day .hd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.day .hd .name{font-size:15px;font-weight:700;min-width:90px}
.day .hd .name span{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:6px}
.day .hd .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--cc)}
.chip.on{background:var(--cc);border-color:var(--cc);color:#fff}
.chip.rest.on{background:var(--t-rest);border-color:var(--t-rest)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;padding:12px 14px 14px;align-items:start}
.cards.n1{grid-template-columns:minmax(280px,720px)}
.card{border:1px solid var(--border);border-radius:10px;background:var(--card2);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;border-top:4px solid var(--tc)}
.card.on{background:var(--surface);border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 35%,transparent)}
.card.dim{opacity:.85}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .track{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tc)}
.card .mark{font-size:11px;font-weight:700;color:var(--tc);white-space:nowrap}
.card .pickbtn{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--tc);color:var(--tc);background:transparent}
.card .pickbtn:hover{background:var(--tc);color:#fff}
.card .title{font-weight:700;font-size:14px;line-height:1.3}
.card .meta{color:var(--muted);font-size:11.5px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 9px}
.card.on .sec{background:var(--card2)}
.sec .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--tc);display:flex;justify-content:space-between}
.sec .lb em{font-style:normal;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.sec ul{margin:5px 0 0;padding-left:0;list-style:none;font-size:12.5px}
.sec li{padding:1.5px 0;border-bottom:1px dashed var(--border)}
.sec li:last-child{border-bottom:0}
.sec li.h{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.notesbar{border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.notesbtn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.notesbtn:hover{border-color:var(--tc);color:var(--tc)}
.notesbtn small{font-weight:500;color:var(--muted)}

/* popup */
dialog.modal{border:1px solid var(--border);border-radius:14px;padding:0;max-width:720px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog.modal::backdrop{background:rgba(0,0,0,.45)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 10px;border-bottom:1px solid var(--border)}
.modal .mh .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tc,var(--accent))}
.modal .mh h3{margin:2px 0 0;font-size:16px}
.modal .mh button{border:1px solid var(--border);background:var(--card2);border-radius:8px;padding:4px 9px;font-size:13px}
.modal .mb{padding:14px 20px 20px;max-height:70vh;overflow:auto;font-size:14px;line-height:1.55}
.modal .mb p{margin:0 0 12px}
.modal .mb p:last-child{margin-bottom:0}

/* week stimulus */
.stim{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px 14px;margin-top:12px}
.stim .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:10px}
.stim .head b{font-size:13px}
.stim .head span{font-size:12px;color:var(--muted)}
.stim-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 24px}
@media (max-width:900px){.stim-grid{grid-template-columns:1fr}}
.stim h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.stim h4 em{font-style:normal;font-weight:600;color:var(--text);text-transform:none;letter-spacing:0}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--card2)}
.bar i{display:block;height:100%;background:var(--c)}
.bar i:first-child{border-radius:4px 0 0 4px}.bar i:last-child{border-radius:0 4px 4px 0}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:5px;cursor:default}
.keys i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.keys b{color:var(--text);font-weight:600}
.regs{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.regs .n{color:var(--text);white-space:nowrap}
.regs .r{height:10px;border-radius:3px;background:var(--card2);overflow:hidden}
.regs .r i{display:block;height:100%;background:var(--accent);border-radius:3px}
.regs .v{color:var(--muted);font-variant-numeric:tabular-nums}
.stim .none{font-size:12px;color:var(--light);font-style:italic}
.rest{color:var(--muted);font-size:13px;padding:10px 14px 14px}
.empty{color:var(--light);font-style:italic}

/* cycle panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px;font-size:14px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:4px 0;font-size:13px}
.panel p{margin:8px 0 0;font-size:12.5px}
footer{margin-top:28px;color:var(--light);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media print{
  body{background:#fff}.controls,.chips,.pickbtn,footer,.toast{display:none!important}
  .day{break-inside:avoid;box-shadow:none}.card{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>CFNYC Tracks <small>CrossFit NYC weekly programming, by track</small></h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="controls">
      <label for="weekSel" class="sub">Week</label>
      <select id="weekSel"></select>
      <button id="btnReset" title="Reset every day to the default track (CrossFit where available)">Reset picks</button>
      <button id="btnCopy" class="primary" title="Copy your week as plain text">Copy my week</button>
    </div>
  </header>

  <div class="ann" id="ann" hidden></div>

  <section>
    <h2>Your week <span id="pickSummary"></span></h2>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
    <div class="stim" id="stim"></div>
  </section>

  <section>
    <h2>All workouts <span>every track, every day — pick one per day at the top of each day</span></h2>
    <div id="days"></div>
  </section>

  <section>
    <div class="panel" id="cycle"></div>
  </section>

  <footer>
    <span id="srcLine"></span>
    <span>Picks are saved in this browser only.</span>
    <a href="data/index.json">data</a>
  </footer>
</div>
<div class="toast" id="toast"></div>
<dialog class="modal" id="modal"><div class="mh"><div><div class="k" id="mk"></div><h3 id="mt"></h3></div><button id="mclose" type="button">Close ✕</button></div><div class="mb" id="mb"></div></dialog>

<script>
(function(){
const DAYS=[['mon','Mon','Monday'],['tue','Tue','Tuesday'],['wed','Wed','Wednesday'],['thu','Thu','Thursday'],['fri','Fri','Friday'],['sat','Sat','Saturday'],['sun','Sun','Sunday']];
const TRACK_ORDER=['crossfit','athx','strength','oly'];
const SHORT={crossfit:'CrossFit',athx:'ATHX',strength:'Strength',oly:'Oly',rest:'Rest'};
let index=null, week=null, picks={};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc=t=>`var(--t-${t})`;
const fmtDate=iso=>{const d=new Date(iso+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};

function storeKey(){return 'cfnyc-picks:'+week.week_of}
function loadPicks(){try{const s=localStorage.getItem(storeKey());picks=s?JSON.parse(s):{}}catch(e){picks={}}
  for(const [d] of DAYS){ if(!picks[d] || !valid(d,picks[d])) picks[d]=defaultPick(d); }
}
function savePicks(){try{localStorage.setItem(storeKey(),JSON.stringify(picks))}catch(e){}}
function available(d){return TRACK_ORDER.filter(t=>week.tracks[t]&&week.tracks[t].days&&week.tracks[t].days[d])}
function valid(d,t){return t==='rest'||available(d).includes(t)}
function defaultPick(d){const a=available(d);return a.includes('crossfit')?'crossfit':(a[0]||'rest')}
function setPick(d,t){picks[d]=t;savePicks();render()}
function dayOf(t,d){return week.tracks[t]?.days?.[d]}
function trackName(t){return t==='rest'?'Rest':(week.tracks[t]?.name||t)}
function minutes(w){return (w?.sections||[]).reduce((s,x)=>s+(+x.est_minutes||0),0)}
function dateFor(d){
  for(const t of TRACK_ORDER){const w=dayOf(t,d);if(w?.date)return w.date}
  const i=DAYS.findIndex(x=>x[0]===d);const dt=new Date(week.week_of+'T12:00:00');dt.setDate(dt.getDate()+i);return dt.toISOString().slice(0,10);
}

function render(){ renderHeader(); renderAnn(); renderStrip(); renderStim(); renderDays(); renderCycle(); }

function renderHeader(){
  const c=week.cycle;
  $('#sub').innerHTML=`${esc(week.label)}${c?` · <span class="pill"><span class="dot" style="background:${tc(c.track)}"></span>${esc(trackName(c.track))} ${esc(c.name)} — week ${c.week} of ${c.of}</span>`:''}`;
  $('#legend').innerHTML=TRACK_ORDER.filter(t=>week.tracks[t]).map(t=>`<span><i style="background:${tc(t)}"></i>${esc(week.tracks[t].name)}</span>`).join('')+`<span><i style="background:var(--t-rest)"></i>Rest</span>`;
  $('#srcLine').textContent=`Source: "${week.source?.subject||'newsletter'}" received ${week.source?.received?new Date(week.source.received).toLocaleString():''}`;
  const counts={};for(const [d] of DAYS){counts[picks[d]]=(counts[picks[d]]||0)+1}
  $('#pickSummary').textContent=Object.entries(counts).filter(([k])=>k!=='rest').map(([k,v])=>`${SHORT[k]} ×${v}`).join(' · ')+(counts.rest?` · Rest ×${counts.rest}`:'');
}
function renderAnn(){
  const a=week.announcements||[];const el=$('#ann');
  if(!a.length){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=`<h2>This week at CFNYC</h2><div class="ann-grid">${a.map(x=>`<div class="ann-item"><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></div>`).join('')}</div>`;
}
function renderStrip(){
  $('#strip').innerHTML=DAYS.map(([d,lab])=>{const p=picks[d];const w=p!=='rest'?dayOf(p,d):null;
    return `<a class="tile" href="#day-${d}" style="--tc:${p==='rest'?'var(--t-rest)':tc(p)}"><div class="d"><b>${lab}</b><span>${fmtDate(dateFor(d))}</span></div><div class="tr">${esc(trackName(p))}</div><div class="t">${w?esc(w.title):(available(d).length?'Rest day':'—')}</div></a>`}).join('');
}
function cardHTML(t,w,d){
  const on=picks[d]===t, mins=minutes(w);
  return `<div class="card ${on?'on':'dim'}" style="--tc:${tc(t)}">
    <div class="top"><span class="track">${esc(week.tracks[t].name)}</span>${on?`<span class="mark">✓ Your pick</span>`:`<button class="pickbtn" data-d="${d}" data-t="${t}">Pick</button>`}</div>
    <div class="title">${esc(w.title||'')}</div>
    ${mins?`<div class="meta">≈${mins} min of programmed work</div>`:''}
    ${(w.sections||[]).map(s=>`<div class="sec"><div class="lb"><span>${esc(s.label)}</span>${s.est_minutes?`<em>≈${s.est_minutes}′</em>`:''}</div><ul>${(s.lines||[]).map(l=>`<li class="${/:$/.test(l)?'h':''}">${esc(l)}</li>`).join('')}</ul></div>`).join('')}
    ${(w.tags||[]).length?`<div class="tags">${w.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}
    ${w.coach_notes?`<div class="notesbar"><button class="notesbtn" data-notes="${t}|${d}">📝 Coach notes <small>· read full write-up</small></button></div>`:''}
  </div>`;
}
function paragraphs(txt){return String(txt).trim().split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}
function openModal(kicker,title,text,color){
  const m=$('#modal');$('#mk').textContent=kicker;$('#mt').textContent=title;$('#mb').innerHTML=paragraphs(text);
  m.style.setProperty('--tc',color||'var(--accent)');m.showModal();$('#mb').scrollTop=0;
}
function renderDays(){
  $('#days').innerHTML=DAYS.map(([d,lab,full])=>{
    const avail=available(d), pick=picks[d];
    const chips=[...avail.map(t=>`<button class="chip ${pick===t?'on':''}" style="--cc:${tc(t)}" data-d="${d}" data-t="${t}">${esc(week.tracks[t].name)}</button>`),
      `<button class="chip rest ${pick==='rest'?'on':''}" data-d="${d}" data-t="rest">Rest</button>`].join('');
    const body=avail.length
      ?`<div class="cards ${avail.length===1?'n1':''}">${avail.map(t=>cardHTML(t,dayOf(t,d),d)).join('')}</div>`
      :`<div class="rest">No programming published for ${full}.</div>`;
    return `<div class="day" id="day-${d}">
      <div class="hd"><div class="name">${full}<span>${fmtDate(dateFor(d))}</span></div><span class="lbl">My pick</span><div class="chips">${chips}</div></div>
      ${body}
    </div>`;
  }).join('');
  $('#days').querySelectorAll('.chip,.pickbtn').forEach(b=>b.addEventListener('click',()=>setPick(b.dataset.d,b.dataset.t)));
  $('#days').querySelectorAll('.notesbtn').forEach(b=>b.addEventListener('click',()=>{const [t,d]=b.dataset.notes.split('|');const w=dayOf(t,d);const full=DAYS.find(x=>x[0]===d)[2];
    openModal(`${trackName(t)} · ${full} ${fmtDate(dateFor(d))}`,w.title,w.coach_notes,tc(t))}));
}

/* ---- week stimulus (from picks) ---- */
const LIFT=[['power','Power','Olympic lifts, jumps, throws — force produced fast'],['strength','Strength','Heavy work ≤6 reps, RM tests, cluster sets'],['hypertrophy','Hypertrophy','8–15 reps, tempo work, accessories'],['skill','Skill','Gymnastics / skill practice']];
const COND=[['aerobic','Aerobic','Steady or long mixed-modal ≥20 min, runs, race-style hybrids'],['threshold','Threshold','Sustained hard 8–20 min pieces'],['vo2','VO2','Hard repeats of 2–5 min with rest'],['hiit','HIIT','Short intervals under ~2:30 with rest'],['sprint','Sprint / top-end','Max efforts under 60 s, full recovery']];
const REGION_ORDER=['quads','posterior chain','upper push','upper pull','core','arms','full body'];
function renderStim(){
  const lift={},cond={},reg={};let liftT=0,condT=0,untagged=0;
  for(const [d] of DAYS){const p=picks[d];if(p==='rest')continue;const w=dayOf(p,d);if(!w)continue;
    for(const s of w.sections||[]){const st=s.stimulus;if(!st||!st.length){untagged+=+s.est_minutes||0;continue}
      for(const x of st){const m=+x.minutes||0;const q=x.quality;
        if(LIFT.some(l=>l[0]===q)){lift[q]=(lift[q]||0)+m;liftT+=m;const rs=x.regions||[];for(const r of rs)reg[r]=(reg[r]||0)+m/rs.length}
        else if(COND.some(c=>c[0]===q)){cond[q]=(cond[q]||0)+m;condT+=m}}}}
  const tot=liftT+condT;
  const barOf=(defs,vals,T)=>{const items=defs.filter(([k])=>vals[k]);if(!items.length)return `<div class="none">Nothing picked yet.</div>`;
    return `<div class="bar">${items.map(([k])=>`<i style="--c:var(--q-${k});flex:${vals[k]}" title="${k}"></i>`).join('')}</div>
    <div class="keys">${items.map(([k,n,def])=>`<span title="${esc(def)}"><i style="--c:var(--q-${k})"></i><b>${n}</b> ${Math.round(vals[k]/T*100)}% · ≈${Math.round(vals[k])}′</span>`).join('')}</div>`};
  const regs=REGION_ORDER.filter(r=>reg[r]).concat(Object.keys(reg).filter(r=>!REGION_ORDER.includes(r)));const rmax=Math.max(1,...regs.map(r=>reg[r]));
  const regHTML=regs.length?`<div class="regs">${regs.map(r=>`<span class="n">${esc(r)}</span><span class="r"><i style="width:${Math.round(reg[r]/rmax*100)}%"></i></span><span class="v">≈${Math.round(reg[r])}′</span>`).join('')}</div>`:`<div class="none">No lifting picked.</div>`;
  $('#stim').innerHTML=`<div class="head"><b>Week stimulus</b><span>from your picks · ≈${Math.round(tot)} min programmed${tot?` · lifting ${Math.round(liftT/tot*100)}% / conditioning ${Math.round(condT/tot*100)}%`:''}${untagged?` · ${untagged}′ mobility/other not counted`:''}</span></div>
    <div class="stim-grid">
      <div><h4>Lifting <em>≈${Math.round(liftT)}′</em></h4>${barOf(LIFT,lift,liftT||1)}</div>
      <div><h4>Conditioning <em>≈${Math.round(condT)}′</em></h4>${barOf(COND,cond,condT||1)}</div>
      <div><h4>Lifting by body region <em>min, split across regions</em></h4>${regHTML}</div>
    </div>`;
}
function renderCycle(){
  const c=week.cycle;
  const notes=TRACK_ORDER.filter(t=>week.tracks[t]?.note&&!(c&&t===c.track)).map(t=>`<p><b style="color:${tc(t)}">${esc(week.tracks[t].name)}:</b> ${esc(week.tracks[t].note)}</p>`).join('');
  $('#cycle').innerHTML=(c?`<h3>${esc(trackName(c.track))} — ${esc(c.name)} (week ${c.week}/${c.of})</h3><ul>${(c.focus||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${c.full_text?`<p><button class="notesbtn" id="cycleBtn" style="--tc:${tc(c.track)}">📝 Read the full cycle write-up</button></p>`:''}`:'<h3>Programming notes</h3>')+(notes||(c?'':'<p class="empty">No notes this week.</p>'));
  const cb=$('#cycleBtn');if(cb)cb.addEventListener('click',()=>openModal(`${trackName(c.track)} · week ${c.week} of ${c.of}`,c.name,c.full_text,tc(c.track)));
}

function weekText(){
  const out=[`${week.label} — my week`,''];
  for(const [d,lab] of DAYS){const p=picks[d];const w=p!=='rest'?dayOf(p,d):null;
    out.push(`${lab} ${fmtDate(dateFor(d))} — ${w?trackName(p)+': '+w.title:'Rest'}`);
    if(w){for(const s of w.sections||[]){out.push(`  ${s.label}${s.est_minutes?` (≈${s.est_minutes} min)`:''}`);for(const l of s.lines||[])out.push(`    ${l}`)} if(w.coach_notes)out.push(`  Notes: ${w.coach_notes}`)}
    out.push('')}
  return out.join('\n');
}

async function loadWeek(file){
  const r=await fetch('data/'+file,{cache:'no-store'});if(!r.ok)throw new Error('week fetch '+r.status);
  week=await r.json();loadPicks();render();
}
async function init(){
  try{
    const r=await fetch('data/index.json',{cache:'no-store'});if(!r.ok)throw new Error('index fetch '+r.status);
    index=await r.json();
    const weeks=[...index.weeks].sort((a,b)=>b.week_of.localeCompare(a.week_of));
    const sel=$('#weekSel');sel.innerHTML=weeks.map(w=>`<option value="${esc(w.file)}">${esc(w.label)}</option>`).join('');
    const now=new Date();let pick=weeks[0];
    for(const w of weeks){const mon=new Date(w.week_of+'T00:00:00');if(mon-now<7*864e5){pick=w;break}}
    sel.value=pick.file;
    sel.addEventListener('change',()=>loadWeek(sel.value));
    $('#mclose').addEventListener('click',()=>$('#modal').close());
    $('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});
    $('#btnReset').addEventListener('click',()=>{for(const [d] of DAYS)picks[d]=defaultPick(d);savePicks();render();toast('Picks reset')});
    $('#btnCopy').addEventListener('click',async()=>{const t=weekText();try{await navigator.clipboard.writeText(t);toast('Week copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Week copied')}});
    await loadWeek(pick.file);
  }catch(e){$('#sub').textContent='Could not load data: '+e.message;console.error(e)}
}
init();
})();
</script>
</body>
</html>
