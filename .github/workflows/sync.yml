name: Sync newsletter → data

on:
  schedule:
    # Newsletter lands ~12:00 pm New York time on Sundays.
    # 16:45 UTC = 12:45 pm EDT; 17:45 UTC = 12:45 pm EST. Both fire year-round; the script is idempotent.
    - cron: "45 16 * * 0"
    - cron: "45 17 * * 0"
    # Late-newsletter safety net: 3:45 pm and 7:45 pm New York (approx).
    - cron: "45 19 * * 0"
    - cron: "45 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and print, but do not commit"
        type: boolean
        default: false
      force:
        description: "Re-parse even if this week's file already exists"
        type: boolean
        default: false
      lookback_days:
        description: "How many days back to look for the newsletter"
        default: "3"

permissions:
  contents: write

concurrency:
  group: sync-newsletter
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Fetch, parse, validate
        id: parse
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: python scripts/sync_newsletter.py

      - name: Commit and push
        if: steps.parse.outputs.changed == 'true'
        run: |
          git config user.name "cfnyc-tracks bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: week of ${{ steps.parse.outputs.week_of }} (tracks: ${{ steps.parse.outputs.tracks }})"
          git push
