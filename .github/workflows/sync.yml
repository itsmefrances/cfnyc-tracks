name: Sync newsletter → data

on:
  schedule:
    # Newsletter usually lands 12:06 pm New York time on Sundays (occasionally 12:36–1:41 pm; once 4:36 pm).
    # Runs at 12:10, 12:15, 12:30, 1:00 pm and 4:00 pm New York. GitHub cron is UTC and has no DST,
    # so each time is listed twice (EDT = UTC-4, EST = UTC-5); the script is idempotent, extra fires are no-ops.
    # --- EDT (Mar–Nov) ---
    - cron: "10 16 * * 0"   # 12:10 pm
    - cron: "15 16 * * 0"   # 12:15 pm
    - cron: "30 16 * * 0"   # 12:30 pm
    - cron: "0 17 * * 0"    #  1:00 pm
    - cron: "0 20 * * 0"    #  4:00 pm
    # --- EST (Nov–Mar) ---
    - cron: "10 17 * * 0"   # 12:10 pm
    - cron: "15 17 * * 0"   # 12:15 pm
    - cron: "30 17 * * 0"   # 12:30 pm
    - cron: "0 18 * * 0"    #  1:00 pm
    - cron: "0 21 * * 0"    #  4:00 pm
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and print, but do not commit"
        type: boolean
        default: false
      force:
        description: "Re-parse even if this week's file already exists"
        type: boolean
        default: false
      lookback_days:
        description: "How many days back to look for the newsletter"
        default: "3"

permissions:
  contents: write

concurrency:
  group: sync-newsletter
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Fetch, parse, validate
        id: parse
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: python scripts/sync_newsletter.py

      - name: Commit and push
        if: steps.parse.outputs.changed == 'true'
        run: |
          git config user.name "cfnyc-tracks bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: week of ${{ steps.parse.outputs.week_of }} (tracks: ${{ steps.parse.outputs.tracks }})"
          git push
