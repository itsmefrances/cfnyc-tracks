name: Sync newsletter → data

on:
  # Schedule disabled 2026-10-04: the weekly sync now runs through Claude's scheduled task
  # (see README). To use this workflow instead, add the three repo secrets and restore the
  # `schedule:` block (Sundays 16:10,16:15,16:30,17:00,20:00 UTC in summer; +1h in winter).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and print, but do not commit"
        type: boolean
        default: false
      force:
        description: "Re-parse even if this week's file already exists"
        type: boolean
        default: false
      lookback_days:
        description: "How many days back to look for the newsletter"
        default: "3"

permissions:
  contents: write

concurrency:
  group: sync-newsletter
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Fetch, parse, validate
        id: parse
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: python scripts/sync_newsletter.py

      - name: Commit and push
        if: steps.parse.outputs.changed == 'true'
        run: |
          git config user.name "cfnyc-tracks bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: week of ${{ steps.parse.outputs.week_of }} (tracks: ${{ steps.parse.outputs.tracks }})"
          git push
